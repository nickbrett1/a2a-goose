# Generated by genproj. Classifies the notes GitHub generates for a Release
# (the release workflow passes --generate-notes). A pull request carrying none
# of these labels falls through to "Other changes".
changelog:
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
